<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#f6e7c8">
  <title>ZzStudio · Müzik</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../src/game/game.css">
  <link rel="stylesheet" href="../../src/studio/studio.css">
  <link rel="stylesheet" href="../../src/studio/music.css">
</head>
<body class="studio music">
  <header class="st-top">
    <button type="button" class="st-btn" id="btn-songs" data-i18n="music.songs"></button>
    <input class="st-name" id="song-name" autocomplete="off" spellcheck="false">
    <button type="button" class="st-btn st-primary st-icon" id="btn-play">▶</button>
    <label class="mu-field"><span data-i18n="music.bpm"></span><input type="number" id="bpm" min="40" max="200"></label>
    <label class="mu-field"><span data-i18n="music.scale"></span><select id="scale"></select></label>
    <label class="mu-field"><span data-i18n="music.root"></span><select id="root"></select></label>
    <label class="mu-field"><span data-i18n="music.steps"></span><select id="steps"></select></label>
    <label class="mu-field"><span data-i18n="music.swing"></span><input type="range" id="swing" min="0" max="0.6" step="0.05"></label>
    <label class="st-check mu-night"><input type="checkbox" id="night"><span data-i18n="music.night"></span></label>
    <span class="st-spacer"></span>
    <button type="button" class="st-btn st-icon" id="btn-undo" data-i18n-title="studio.undo">↶</button>
    <button type="button" class="st-btn st-icon" id="btn-redo" data-i18n-title="studio.redo">↷</button>
    <a class="st-btn" href="../" data-i18n="music.objects"></a>
  </header>

  <main class="mu-main">
    <aside class="mu-tracks" id="tracks"></aside>
    <section class="mu-grid-wrap"><div class="mu-grid" id="grid"></div></section>
  </main>

  <dialog class="st-dialog" id="songs"></dialog>
  <script type="module" src="../../src/studio/music-main.js"></script>
</body>
</html>
